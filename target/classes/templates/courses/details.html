<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.title} + ' - LearnHub'">Course Details - LearnHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-lg">L</span>
                        </div>
                        <span class="text-xl font-bold text-gray-800">LearnHub</span>
                    </a>
                </div>
                
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-gray-600 hover:text-purple-600 transition-colors">Home</a>
                    <a href="/courses" class="text-gray-600 hover:text-purple-600 transition-colors">Courses</a>
                    
                    <!-- Role-based navigation -->
                    <div th:if="${currentUser != null}">
                        <a th:if="${currentUser.role.name() == 'STUDENT'}" href="/student/dashboard" 
                           class="text-gray-600 hover:text-purple-600 transition-colors">My Learning</a>
                        <a th:if="${currentUser.role.name() == 'INSTRUCTOR'}" href="/instructor/dashboard" 
                           class="text-gray-600 hover:text-purple-600 transition-colors">Instructor</a>
                        <a th:if="${currentUser.role.name() == 'ADMIN'}" href="/admin/dashboard" 
                           class="text-gray-600 hover:text-purple-600 transition-colors">Admin</a>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div th:if="${currentUser == null}">
                        <a href="/login" class="text-gray-600 hover:text-purple-600 transition-colors">Login</a>
                        <a href="/register" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors">Sign Up</a>
                    </div>
                    
                    <div th:if="${currentUser != null}" class="relative">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center">
                                <span class="text-white text-sm font-medium" th:text="${currentUser.firstName.charAt(0)}"></span>
                            </div>
                            <span class="text-gray-700" th:text="${currentUser.firstName}"></span>
                            <button onclick="toggleUserMenu()" class="text-gray-500 hover:text-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Dropdown Menu -->
                        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                            <div th:if="${currentUser.role.name() == 'ADMIN'}">
                                <a href="/admin/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">System Settings</a>
                            </div>
                            <hr class="my-1">
                            <a href="/logout" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Course Details -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Main Content -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                    <!-- Course Image -->
                    <div class="h-64 bg-gray-200 flex items-center justify-center">
                        <img th:if="${course.courseImageUrl != null}" th:src="${course.courseImageUrl}" 
                             th:alt="${course.title}" class="w-full h-full object-cover"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div th:if="${course.courseImageUrl == null}" class="text-gray-500 flex items-center justify-center w-full h-full">
                            <svg class="w-20 h-20 mx-auto" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"></path>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="p-8">
                        <h1 class="text-3xl font-bold text-gray-900 mb-4" th:text="${course.title}"></h1>
                        
                        <div class="flex items-center mb-6">
                            <div class="w-12 h-12 bg-purple-600 rounded-full flex items-center justify-center">
                                <span class="text-white font-medium" th:text="${course.instructor.firstName.charAt(0)}"></span>
                            </div>
                            <div class="ml-4">
                                <p class="font-medium text-gray-900" th:text="${course.instructor.firstName + ' ' + course.instructor.lastName}"></p>
                                <p class="text-sm text-gray-500">Instructor</p>
                            </div>
                        </div>
                        
                        <div class="prose max-w-none">
                            <h3 class="text-xl font-semibold mb-4">About This Course</h3>
                            <p class="text-gray-700 leading-relaxed" th:text="${course.description}"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Sidebar -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-lg p-6 sticky top-8">
                    <div class="text-center mb-6">
                        <div class="text-3xl font-bold text-purple-600 mb-2">Free</div>
                        <p class="text-gray-600">Start learning today</p>
                    </div>
                    
                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Lessons</span>
                            <span class="font-medium" th:text="${course.lessonCount}">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Students</span>
                            <span class="font-medium" th:text="${course.enrollmentCount}">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Created</span>
                            <span class="font-medium" th:text="${#temporals.format(course.createdAt, 'MMM yyyy')}"></span>
                        </div>
                    </div>
                    
                    <div th:if="${currentUser == null}" class="space-y-3">
                        <a href="/register" class="block w-full bg-purple-600 text-white text-center py-3 rounded-lg hover:bg-purple-700 transition-colors">
                            Sign Up to Enroll
                        </a>
                        <a href="/login" class="block w-full border border-purple-600 text-purple-600 text-center py-3 rounded-lg hover:bg-purple-50 transition-colors">
                            Login to Enroll
                        </a>
                    </div>
                    
                    <div th:if="${currentUser != null and currentUser.role.name() == 'STUDENT'}" class="space-y-3">
                        <form th:action="@{/student/courses/{id}/enroll(id=${course.id})}" method="post" class="w-full">
                            <button type="submit" 
                                    class="block w-full bg-purple-600 text-white text-center py-3 rounded-lg hover:bg-purple-700 transition-colors">
                                Enroll Now
                            </button>
                        </form>
                    </div>
                    
                    <div th:if="${currentUser != null and currentUser.role.name() != 'STUDENT'}" class="text-center text-gray-500">
                        <p class="text-sm">Only students can enroll in courses</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('userMenu');
            const button = event.target.closest('button');
            if (!button && !menu.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>

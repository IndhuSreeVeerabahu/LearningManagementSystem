<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Lesson - LearnHub Instructor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-lg">L</span>
                        </div>
                        <span class="text-xl font-bold text-gray-800">LearnHub</span>
                    </a>
                </div>
                
                <div class="flex items-center space-x-8">
                    <a href="/instructor/dashboard" class="text-gray-600 hover:text-purple-600 transition-colors">Dashboard</a>
                    <a href="/instructor/courses" class="text-gray-600 hover:text-purple-600 transition-colors">My Courses</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center">
                                <span class="text-white text-sm font-medium" th:text="${currentUser != null ? currentUser.firstName.charAt(0) : 'I'}"></span>
                            </div>
                            <span class="text-gray-700" th:text="${currentUser != null ? currentUser.firstName : 'Instructor'}"></span>
                            <button onclick="toggleUserMenu()" class="text-gray-500 hover:text-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Dropdown Menu -->
                        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                            <hr class="my-1">
                            <a href="/logout" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Lesson Form -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900" th:text="${lesson.id != null ? 'Edit Lesson' : 'Add New Lesson'}">Add New Lesson</h1>
            <p class="text-gray-600 mt-2">
                <span th:text="${lesson.id != null ? 'Edit lesson in' : 'Add a lesson to'}"></span> 
                <span th:text="${course.title}"></span>
            </p>
        </div>
        
        <div class="bg-white rounded-lg shadow-lg p-8">
            <form th:action="${lesson.id != null ? '/instructor/courses/' + course.id + '/lessons/' + lesson.id : '/instructor/courses/' + course.id + '/lessons'}" 
                  method="post" 
                  enctype="multipart/form-data">
                
                <div class="space-y-6">
                    <!-- Lesson Title -->
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Lesson Title</label>
                        <input type="text" id="title" name="title" th:value="${lesson.title}" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                               placeholder="Enter lesson title">
                    </div>
                    
                    <!-- Lesson Content -->
                    <div>
                        <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Lesson Content</label>
                        <textarea id="content" name="content" rows="8" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                  placeholder="Enter the lesson content, instructions, or description" th:text="${lesson.content}"></textarea>
                    </div>
                    
                    <!-- Lesson Order -->
                    <div>
                        <label for="lessonOrder" class="block text-sm font-medium text-gray-700 mb-2">Lesson Order</label>
                        <input type="number" id="lessonOrder" name="lessonOrder" th:value="${lesson.lessonOrder}" min="1"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                               placeholder="Enter lesson order (1, 2, 3, etc.)">
                    </div>
                    
                    <!-- Duration -->
                    <div>
                        <label for="durationMinutes" class="block text-sm font-medium text-gray-700 mb-2">Duration (minutes)</label>
                        <input type="number" id="durationMinutes" name="durationMinutes" th:value="${lesson.durationMinutes}" min="1"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                               placeholder="Estimated duration in minutes">
                    </div>
                    
                    <!-- Published Status -->
                    <div>
                        <label class="flex items-center">
                            <input type="checkbox" name="isPublished" th:checked="${lesson.isPublished}" 
                                   class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700">Publish this lesson</span>
                        </label>
                    </div>
                    
                    <!-- Media Files -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Video Upload -->
                        <div>
                            <label for="videoFile" class="block text-sm font-medium text-gray-700 mb-2">Video File</label>
                            <input type="file" id="videoFile" name="videoFile" accept="video/*"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <p class="text-sm text-gray-500 mt-1">Upload a video file (MP4, AVI, etc.)</p>
                        </div>
                        
                        <!-- PDF Upload -->
                        <div>
                            <label for="pdfFile" class="block text-sm font-medium text-gray-700 mb-2">PDF Document</label>
                            <input type="file" id="pdfFile" name="pdfFile" accept=".pdf"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <p class="text-sm text-gray-500 mt-1">Upload a PDF document</p>
                        </div>
                        
                        <!-- Image Upload -->
                        <div>
                            <label for="imageFile" class="block text-sm font-medium text-gray-700 mb-2">Image</label>
                            <input type="file" id="imageFile" name="imageFile" accept="image/*"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <p class="text-sm text-gray-500 mt-1">Upload an image (JPG, PNG, etc.)</p>
                        </div>
                        
                        <!-- Audio Upload -->
                        <div>
                            <label for="audioFile" class="block text-sm font-medium text-gray-700 mb-2">Audio File</label>
                            <input type="file" id="audioFile" name="audioFile" accept="audio/*"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <p class="text-sm text-gray-500 mt-1">Upload an audio file (MP3, WAV, etc.)</p>
                        </div>
                    </div>
                </div>
                
                <!-- Form Actions -->
                <div class="flex justify-end space-x-4 mt-8">
                    <a th:href="@{/instructor/courses/{id}/lessons(id=${course.id})}" 
                       class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                        Cancel
                    </a>
                    <button type="submit" 
                            class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">
                        <span th:text="${lesson.id != null ? 'Update Lesson' : 'Add Lesson'}"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('userMenu');
            const button = event.target.closest('button');
            if (!button && !menu.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>

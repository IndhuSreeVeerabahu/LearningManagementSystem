spring:
  application:
    name: learning-management-system
  
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Indhu@2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: ${PORT:8082}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

# File Upload Configuration (Using Uploadcare - no local storage needed)
# file:
#   upload-dir: ${FILE_UPLOAD_DIR:uploads/}

# Uploadcare Configuration
uploadcare:
  public-key: ${UPLOADCARE_PUBLIC_KEY:b0f7f254a904253e9413}
  secret-key: ${UPLOADCARE_SECRET_KEY:ff4562a91207fd1df2d0}
  cdn-url: ${UPLOADCARE_CDN_URL:https://2v4g02ejp8.ucarecd.net}

logging:
  level:
    com.lms: DEBUG
    org.springframework.security: DEBUG

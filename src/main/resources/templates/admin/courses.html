<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - LearnHub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-lg">L</span>
                        </div>
                        <span class="text-xl font-bold text-gray-800">LearnHub</span>
                    </a>
                </div>
                
                <div class="flex items-center space-x-8">
                    <a href="/admin/dashboard" class="text-gray-600 hover:text-purple-600 transition-colors">Dashboard</a>
                    <a href="/admin/users" class="text-gray-600 hover:text-purple-600 transition-colors">Users</a>
                    <a href="/admin/courses" class="text-purple-600 font-semibold">Courses</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center">
                                <span class="text-white text-sm font-medium" th:text="${currentUser != null ? currentUser.firstName.charAt(0) : 'A'}"></span>
                            </div>
                            <span class="text-gray-700" th:text="${currentUser != null ? currentUser.firstName : 'Admin'}"></span>
                            <button onclick="toggleUserMenu()" class="text-gray-500 hover:text-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Dropdown Menu -->
                        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                            <a href="/admin/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">System Settings</a>
                            <hr class="my-1">
                            <a href="/logout" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Course Management -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Flash Messages -->
        <div th:if="${success}" class="mb-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
            <span th:text="${error}"></span>
        </div>
        
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Course Management</h1>
            <p class="text-gray-600 mt-2">Manage all courses in the system</p>
        </div>
        
        <!-- Search -->
        <div class="mb-6">
            <form method="get" action="/admin/courses" class="flex gap-4">
                <input type="text" name="search" th:value="${searchTerm}" 
                       placeholder="Search courses by title or description..."
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition-colors">
                    Search
                </button>
            </form>
        </div>
        
        <!-- Courses Grid -->
        <div th:if="${courses != null and !courses.empty}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="course : ${courses}" class="bg-white rounded-lg shadow-lg overflow-hidden">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <img th:if="${course.courseImage != null}" th:src="${course.courseImage}" 
                         th:alt="${course.title}" class="w-full h-full object-cover">
                    <div th:if="${course.courseImage == null}" class="text-gray-500">
                        <svg class="w-16 h-16 mx-auto" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"></path>
                        </svg>
                    </div>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-semibold mb-2" th:text="${course.title}"></h3>
                    <p class="text-gray-600 mb-4" th:text="${#strings.abbreviate(course.description, 100)}"></p>
                    
                    <!-- Course Status -->
                    <div class="flex items-center mb-4 space-x-2">
                        <span th:if="${course.isApproved}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            Approved
                        </span>
                        <span th:if="${!course.isApproved}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">
                            Pending
                        </span>
                        <span th:if="${course.isPublished}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                            Published
                        </span>
                    </div>
                    
                    <div class="flex items-center justify-between mb-4">
                        <div class="text-sm text-gray-500">
                            <span th:text="${course.instructor.firstName + ' ' + course.instructor.lastName}"></span>
                        </div>
                        <div class="text-sm text-gray-500">
                            <span th:text="${course.lessonCount} + ' lessons'">0 lessons</span>
                        </div>
                    </div>
                    
                    <!-- Admin Actions -->
                    <div class="space-y-2">
                        <!-- View Course Button -->
                        <div>
                            <a th:href="@{/admin/courses/{id}/view(id=${course.id})}" 
                               class="block w-full bg-blue-600 text-white px-3 py-2 rounded text-sm hover:bg-blue-700 transition-colors text-center">
                                View Course Details
                            </a>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="flex space-x-2">
                            <form th:if="${!course.isApproved}" th:action="@{/admin/courses/{id}/approve(id=${course.id})}" method="post" class="flex-1">
                                <button type="submit" class="w-full bg-green-600 text-white px-3 py-2 rounded text-sm hover:bg-green-700 transition-colors">
                                    Approve
                                </button>
                            </form>
                            <form th:if="${course.isApproved}" th:action="@{/admin/courses/{id}/reject(id=${course.id})}" method="post" class="flex-1">
                                <button type="submit" class="w-full bg-yellow-600 text-white px-3 py-2 rounded text-sm hover:bg-yellow-700 transition-colors">
                                    Reject
                                </button>
                            </form>
                            <form th:action="@{/admin/courses/{id}/delete(id=${course.id})}" method="post" class="flex-1">
                                <button type="submit" class="w-full bg-red-600 text-white px-3 py-2 rounded text-sm hover:bg-red-700 transition-colors"
                                        onclick="return confirm('Are you sure you want to delete this course?')">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- No Courses Message -->
        <div th:if="${courses == null or courses.empty}" class="text-center py-12">
            <div class="text-gray-500">
                <svg class="w-16 h-16 mx-auto mb-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h3 class="text-lg font-semibold mb-2">No courses found</h3>
                <p class="text-sm">No courses match your search criteria.</p>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('userMenu');
            const button = event.target.closest('button');
            if (!button && !menu.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>

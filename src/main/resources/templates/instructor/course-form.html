<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.id != null ? 'Edit Course' : 'Create Course'} + ' - LearnHub'">Create Course - LearnHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-lg">L</span>
                        </div>
                        <span class="text-xl font-bold text-gray-800">LearnHub</span>
                    </a>
                </div>
                
                <div class="flex items-center space-x-8">
                    <a href="/instructor/dashboard" class="text-purple-600 font-semibold">Dashboard</a>
                    <a href="/instructor/courses" class="text-gray-600 hover:text-purple-600 transition-colors">My Courses</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center">
                                <span class="text-white text-sm font-medium" th:text="${currentUser != null ? currentUser.firstName.charAt(0) : 'I'}"></span>
                            </div>
                            <span class="text-gray-700" th:text="${currentUser != null ? currentUser.firstName : 'Instructor'}"></span>
                            <button onclick="toggleUserMenu()" class="text-gray-500 hover:text-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Dropdown Menu -->
                        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                            <hr class="my-1">
                            <a href="/logout" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Course Form -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900" th:text="${course.id != null ? 'Edit Course' : 'Create New Course'}"></h1>
            <p class="text-gray-600 mt-2">Build an engaging course for your students</p>
        </div>
        
        <div class="bg-white rounded-lg shadow-lg p-8">
            <form th:action="${course.id != null ? '/instructor/courses/' + course.id : '/instructor/courses'}" 
                  th:method="${course.id != null ? 'POST' : 'POST'}" 
                  enctype="multipart/form-data">
                
                <div class="space-y-6">
                    <!-- Course Title -->
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Course Title</label>
                        <input type="text" id="title" name="title" th:value="${course.title}" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                               placeholder="Enter course title">
                    </div>
                    
                    <!-- Course Description -->
                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Course Description</label>
                        <textarea id="description" name="description" rows="6" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                  placeholder="Describe what students will learn in this course" th:text="${course.description}"></textarea>
                    </div>
                    
                    <!-- Course Image -->
                    <div>
                        <label for="courseImageFile" class="block text-sm font-medium text-gray-700 mb-2">Course Image</label>
                        <input type="file" id="courseImageFile" name="courseImageFile" accept="image/*"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        <p class="text-sm text-gray-500 mt-1">Upload an image that represents your course (optional)</p>
                    </div>
                    
                    <!-- Current Image Display -->
                    <div th:if="${course.courseImage != null}" class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Current Image</label>
                        <img th:src="${course.courseImage}" th:alt="${course.title}" 
                             class="w-32 h-32 object-cover rounded-lg border">
                    </div>
                </div>
                
                <!-- Form Actions -->
                <div class="flex justify-end space-x-4 mt-8">
                    <a href="/instructor/courses" 
                       class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                        Cancel
                    </a>
                    <button type="submit" 
                            class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">
                        <span th:text="${course.id != null ? 'Update Course' : 'Create Course'}"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('userMenu');
            const button = event.target.closest('button');
            if (!button && !menu.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.title} + ' - Lessons'">Course Lessons - LearnHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-lg">L</span>
                        </div>
                        <span class="text-xl font-bold text-gray-800">LearnHub</span>
                    </a>
                </div>
                
                <div class="flex items-center space-x-8">
                    <a href="/instructor/dashboard" class="text-gray-600 hover:text-purple-600 transition-colors">Dashboard</a>
                    <a href="/instructor/courses" class="text-gray-600 hover:text-purple-600 transition-colors">My Courses</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center">
                                <span class="text-white text-sm font-medium" th:text="${currentUser != null ? currentUser.firstName.charAt(0) : 'I'}"></span>
                            </div>
                            <span class="text-gray-700" th:text="${currentUser != null ? currentUser.firstName : 'Instructor'}"></span>
                            <button onclick="toggleUserMenu()" class="text-gray-500 hover:text-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Dropdown Menu -->
                        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                            <hr class="my-1">
                            <a href="/logout" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Lessons Content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900" th:text="${course.title}"></h1>
                    <p class="text-gray-600 mt-2">Manage your course lessons</p>
                </div>
                <a th:href="@{/instructor/courses/{id}/lessons/new(id=${course.id})}" 
                   class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors">
                    Add New Lesson
                </a>
            </div>
        </div>
        
        <!-- Lessons List -->
        <div class="bg-white rounded-lg shadow-lg">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-900">Course Lessons</h2>
            </div>
            
            <div class="p-6">
                <div th:if="${lessons != null and !lessons.empty}" class="space-y-4">
                    <div th:each="lesson : ${lessons}" class="border border-gray-200 rounded-lg p-4">
                        <div class="flex items-center justify-between">
                            <div class="flex-1">
                                <h3 class="text-lg font-semibold text-gray-900" th:text="${lesson.title}"></h3>
                                <p class="text-gray-600 mt-1" th:text="${#strings.abbreviate(lesson.content, 150)}"></p>
                                <div class="flex items-center mt-2 text-sm text-gray-500">
                                    <span th:if="${lesson.videoUrl != null}" class="mr-4">Video</span>
                                    <span th:if="${lesson.pdfUrl != null}" class="mr-4">PDF</span>
                                    <span th:if="${lesson.imageUrl != null}" class="mr-4">Image</span>
                                    <span th:if="${lesson.audioUrl != null}" class="mr-4">Audio</span>
                                    <span th:if="${lesson.durationMinutes != null}" th:text="${lesson.durationMinutes} + ' min'"></span>
                                </div>
                            </div>
                            <div class="flex space-x-2 ml-4">
                                <a th:href="@{/instructor/courses/{courseId}/lessons/{lessonId}/edit(courseId=${course.id}, lessonId=${lesson.id})}" 
                                   class="text-blue-600 hover:text-blue-700 text-sm font-medium">
                                    Edit
                                </a>
                                <form th:action="@{/instructor/courses/{courseId}/lessons/{lessonId}/delete(courseId=${course.id}, lessonId=${lesson.id})}" 
                                      method="post" class="inline">
                                    <button type="submit" class="text-red-600 hover:text-red-700 text-sm font-medium"
                                            onclick="return confirm('Are you sure you want to delete this lesson?')">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div th:if="${lessons == null or lessons.empty}" class="text-center py-8">
                    <div class="text-gray-500">
                        <svg class="w-16 h-16 mx-auto mb-4" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                        <h3 class="text-lg font-semibold mb-2">No lessons yet</h3>
                        <p class="text-sm mb-4">Start building your course by adding your first lesson.</p>
                        <a th:href="@{/instructor/courses/{id}/lessons/new(id=${course.id})}" 
                           class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition-colors">
                            Add First Lesson
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Back to Courses -->
        <div class="mt-8">
            <a href="/instructor/courses" class="text-purple-600 hover:text-purple-700 font-medium">
                ← Back to My Courses
            </a>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('userMenu');
            const button = event.target.closest('button');
            if (!button && !menu.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>

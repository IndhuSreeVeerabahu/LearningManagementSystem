<!DOCTYPE html>
<html>
<head>
    <title>Certificate of Completion</title>
    <style>
        body { 
            font-family: 'Times New Roman', serif; 
            text-align: center; 
            margin: 0; 
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .certificate { 
            background: white; 
            padding: 60px; 
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
            border: 8px solid #f4d03f;
        }
        .header { 
            color: #2c3e50; 
            font-size: 36px; 
            font-weight: bold; 
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .subtitle { 
            color: #7f8c8d; 
            font-size: 18px; 
            margin-bottom: 40px;
        }
        .name { 
            color: #2c3e50; 
            font-size: 48px; 
            font-weight: bold; 
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .course { 
            color: #e74c3c; 
            font-size: 24px; 
            font-weight: bold; 
            margin: 20px 0;
        }
        .date { 
            color: #7f8c8d; 
            font-size: 16px; 
            margin-top: 40px;
        }
        .cert-number {
            color: #95a5a6;
            font-size: 12px;
            margin-top: 20px;
        }
        .logo {
            font-size: 24px;
            color: #3498db;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="certificate">
        <div class="logo">🎓 LearnHub</div>
        <div class="header">CERTIFICATE OF COMPLETION</div>
        <div class="subtitle">This is to certify that</div>
        <div class="name">Indhu Sree</div>
        <div class="subtitle">has successfully completed the course</div>
        <div class="course">Test</div>
        <div class="date">Issued on October 15, 2025</div>
        <div class="cert-number">Certificate Number: CERT-1760518378541-51</div>
    </div>
</body>
</html>
